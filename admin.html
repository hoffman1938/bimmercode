<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - BMW Diagnostic Codes</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Admin Specific Styles */
        .admin-container {
            display: flex;
            min-height: calc(100vh - 80px); /* Minus header */
            margin-top: 80px;
        }

        .sidebar {
            width: 250px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            position: fixed;
            height: 100%;
            top: 80px;
            left: 0;
            overflow-y: auto;
        }

        .sidebar-menu {
            list-style: none;
            padding: 0;
        }

        .sidebar-menu li {
            margin-bottom: 15px;
        }

        .sidebar-menu a {
            color: #ccc;
            text-decoration: none;
            display: flex;
            align-items: center;
            padding: 10px;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .sidebar-menu a:hover, .sidebar-menu a.active {
            background: var(--bmw-blue);
            color: white;
        }

        .sidebar-menu i {
            margin-right: 10px;
            width: 20px;
            text-align: center;
        }

        .main-content {
            flex: 1;
            margin-left: 250px;
            padding: 30px;
            background: var(--bg-dark);
        }

        .dashboard-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid var(--bmw-blue);
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            margin: 10px 0;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .data-table th, .data-table td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .data-table th {
            color: var(--bmw-sky);
        }

        .status-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-active { background: rgba(46, 204, 113, 0.2); color: #2ecc71; }
        .status-banned { background: rgba(231, 76, 60, 0.2); color: #e74c3c; }
        .status-pending { background: rgba(241, 196, 15, 0.2); color: #f1c40f; }

        .action-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-danger { color: #e74c3c; border-color: #e74c3c; }
        .btn-danger:hover { background: rgba(231, 76, 60, 0.2); }
    </style>
</head>
<body class="bmw-pattern">
    <header>
        <div class="logo-container">
            <a class="main_logo_refr" href="index.html">
                <div class="logo">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="48" stroke="white" stroke-width="4" fill="black"/>
                        <circle cx="50" cy="50" r="35" fill="white"/>
                        <path d="M 50,15 A 35,35 0 0,1 85,50 H 50 Z" fill="#1A6FB0"/>
                        <path d="M 50,50 H 85 A 35,35 0 0,1 50,85 Z" fill="white"/>
                        <path d="M 50,50 V 15 A 35,35 0 0,0 15,50 Z" fill="white"/>
                        <path d="M 50,50 H 15 A 35,35 0 0,0 50,85 Z" fill="#1A6FB0"/>
                    </svg>
                </div>
                <h1>Admin Panel</h1>
            </a>
        </div>
        <div class="controls">
            <a href="index.html" class="btn"><i class="fas fa-home"></i> Back to Site</a>
            <button class="btn" onclick="logoutAdmin()"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </header>

    <div class="admin-container">
        <aside class="sidebar">
            <ul class="sidebar-menu">
                <li><a href="#" class="active" onclick="switchTab('users')"><i class="fas fa-users"></i> Users</a></li>
                <li><a href="#" onclick="switchTab('reports')"><i class="fas fa-flag"></i> Reports</a></li>
                <li><a href="#" onclick="switchTab('logs')"><i class="fas fa-history"></i> Audit Logs</a></li>
                <li><a href="#" onclick="switchTab('roles')"><i class="fas fa-user-tag"></i> Roles</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <!-- User Management Section -->
            <div id="tab-users" class="dashboard-section">
                <div class="dashboard-header">
                    <h2>User Management</h2>
                    <div class="search-box" style="width: 300px;">
                        <input type="text" id="user-search" placeholder="Search users..." style="width: 100%;">
                        <i class="fas fa-search"></i>
                    </div>
                </div>
                <div class="dashboard-card">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Username</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Level</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="users-table-body">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                    <div id="users-loading" style="text-align: center; padding: 20px;">
                        <i class="fas fa-spinner fa-spin"></i> Loading...
                    </div>
                </div>
            </div>

            <!-- Reports Section (Placeholder) -->
            <div id="tab-reports" class="dashboard-section hidden">
                <h2>Reports Queue</h2>
                <div class="dashboard-card">
                    <p>Reports integration coming soon...</p>
                </div>
            </div>

            <!-- Logs Section (Placeholder) -->
            <div id="tab-logs" class="dashboard-section hidden">
                <h2>Audit Logs</h2>
                <div class="dashboard-card">
                    <p>Audit logs viewer coming soon...</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Warnings/Ban Modal -->
    <div id="action-modal" class="auth-modal">
        <div class="auth-content">
            <button class="close-auth" onclick="closeActionModal()"><i class="fas fa-times"></i></button>
            <h2 id="action-title">Action</h2>
            <form id="action-form">
                <input type="hidden" id="target-user-id">
                <input type="hidden" id="action-type">
                
                <div class="input-group">
                    <label style="display: block; margin-bottom: 5px; color: #ccc;">Reason</label>
                    <textarea id="action-reason" required style="width: 100%; height: 100px; background: rgba(255,255,255,0.1); border: 1px solid #444; color: white; padding: 10px; border-radius: 5px;"></textarea>
                </div>

                <div id="ban-options" class="hidden">
                    <p style="color: #e74c3c; font-size: 13px; margin-bottom: 10px;">This will permanently ban the user.</p>
                </div>
                
                <button type="submit" class="submit-btn" id="action-submit-btn">Execute</button>
            </form>
        </div>
    </div>

    <script src="./js/admin.js"></script>
</body>
</html>
