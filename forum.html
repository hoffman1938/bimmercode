    <style>
        /* Стили остались те же, сократил для краткости */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 2000; backdrop-filter: blur(5px); opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal-glass { background: #151922; border: 1px solid var(--glass-border); border-radius: 20px; padding: 30px; width: 90%; max-width: 500px; transform: scale(0.9); transition: transform 0.3s; box-shadow: 0 0 40px rgba(0, 102, 179, 0.2); }
        .modal-overlay.active .modal-glass { transform: scale(1); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; color: white; }
        .close-btn { background: none; border: none; color: #94a3b8; font-size: 20px; cursor: pointer; }
        select.form-input option { background: #151922; color: white; }
        .topic-image { max-width: 100%; border-radius: 8px; margin-top: 10px; border: 1px solid var(--glass-border); display: block; }
        .post-controls { display: flex; gap: 10px; opacity: 0.6; transition: 0.2s; margin-left: auto; }
        .post-controls:hover { opacity: 1; }
        .control-btn { background: none; border: none; cursor: pointer; font-size: 14px; padding: 5px; color: var(--text-secondary); }
        .control-btn.delete:hover { color: #e74c3c; } 
        .like-btn { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.05); border: 1px solid transparent; padding: 4px 10px; border-radius: 15px; cursor: pointer; font-size: 13px; color: #94a3b8; }
        .like-btn.liked { color: #e74c3c; background: rgba(231, 76, 60, 0.15); border-color: rgba(231, 76, 60, 0.3); }
        .reply-card.solution { border: 1px solid #2ecc71; background: rgba(46, 204, 113, 0.05); }
        .solution-badge { background: #2ecc71; color: white; font-size: 11px; padding: 2px 8px; border-radius: 10px; margin-left: 10px; display: inline-flex; align-items: center; gap: 4px; }
        .solve-btn { color: #94a3b8; background: none; border: 1px solid #94a3b8; border-radius: 5px; padding: 2px 8px; font-size: 11px; cursor: pointer; opacity: 0.5; }
        .solve-btn:hover { color: #2ecc71; border-color: #2ecc71; opacity: 1; }
        
        /* УВЕДОМЛЕНИЯ */
        .notification-wrapper { position: relative; display: inline-flex; align-items: center; margin-right: 15px; }
        .icon-only { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1); color: white; font-size: 18px; cursor: pointer; }
        .notif-badge { position: absolute; top: 0px; right: 0px; background: #e74c3c; color: white; font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 10px; border: 2px solid #0f1116; pointer-events: none; }
        .notif-dropdown { position: absolute; top: 55px; right: -10px; width: 320px; background: #151922; border: 1px solid var(--glass-border); border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.6); z-index: 1000; overflow: hidden; animation: fadeIn 0.2s ease; backdrop-filter: blur(10px); }
        @media (max-width: 480px) { .notif-dropdown { width: 300px; right: -60px; } }
        .notif-header { padding: 12px 15px; border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 14px; font-weight: bold; color: white; background: rgba(0,0,0,0.2); display: flex; justify-content: space-between; align-items: center; }
        .notif-item { padding: 12px 15px; border-bottom: 1px solid rgba(255,255,255,0.03); cursor: pointer; display: flex; gap: 12px; align-items: start; }
        .notif-item:hover { background: rgba(255,255,255,0.05); }
        .notif-item.unread { background: rgba(0, 102, 179, 0.15); border-left: 3px solid #0066b3; }
        .notif-content { font-size: 13px; color: #e2e8f0; line-height: 1.4; flex: 1; }
        .notif-time { font-size: 11px; color: #94a3b8; margin-top: 4px; display: block; }
    </style>

                            <i class="fas fa-search" style="position: absolute; left: 15px; top: 12px; color: #6f9bd1;"></i>
                            <input type="text" id="forum-search" style="padding: 10px 10px 10px 40px; border-radius: 20px; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.05); color: white; width: 300px;">
                        </div>

                        <button type="button" class="editor-btn" onclick="triggerUpload('topic-content', this)"><i class="fas fa-image"></i></button>

                    <textarea id="topic-content" class="form-input" style="min-height: 120px; border-radius:0 0 5px 5px; margin-top:0;" required></textarea>

                <button type="submit" class="form-submit btn-primary" style="width:100%" data-i18n="modalPublish">Publish</button>
            </form>
        </div>
    </div>

        function toggleLanguage() {
    const langs = ['ru', 'en', 'ka'];
    let idx = langs.indexOf(currentLang);
    currentLang = langs[(idx + 1) % langs.length];
    localStorage.setItem('forumLanguage', currentLang);
    document.getElementById('current-lang').innerText = currentLang.toUpperCase(); // ← ДОБАВЛЕНА
    applyTranslations();
    loadTopics();
    checkNotifications(); 
}

        function applyTranslations() {
            const t = forumTranslations[currentLang];
            
            // Текст
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) el.innerText = t[key];
            });
            
            // Current language
            const langEl = document.getElementById('current-lang');
            if(langEl) langEl.innerText = currentLang.toUpperCase();

            // Категории - с безопасными проверками
            const categorySelect = document.getElementById('topic-category');
            if(categorySelect && categorySelect.options) {
                if(categorySelect.options.length > 0) categorySelect.options[0].text = t.cat_engine;
                if(categorySelect.options.length > 1) categorySelect.options[1].text = t.cat_chassis;
                if(categorySelect.options.length > 2) categorySelect.options[2].text = t.cat_coding;
                if(categorySelect.options.length > 3) categorySelect.options[3].text = t.cat_general;
            }

            // Плейсхолдеры
            if(document.getElementById('forum-search')) document.getElementById('forum-search').placeholder = t.ph_search;
            if(document.getElementById('reply-input')) document.getElementById('reply-input').placeholder = t.ph_reply;
            if(document.getElementById('profile-car')) document.getElementById('profile-car').placeholder = t.ph_car;
            if(document.getElementById('profile-bio')) document.getElementById('profile-bio').placeholder = t.ph_bio;
            if(document.getElementById('topic-title')) document.getElementById('topic-title').placeholder = t.ph_topic_title;
            if(document.getElementById('topic-content')) document.getElementById('topic-content').placeholder = t.ph_topic_desc;

            // Уведомления
            if(document.getElementById('notif-header-title')) document.getElementById('notif-header-title').innerText = t.n_header;
            if(document.getElementById('notif-read-all-btn')) document.getElementById('notif-read-all-btn').innerText = t.n_read_all;
            if(document.getElementById('notif-empty-msg')) document.getElementById('notif-empty-msg').innerText = t.n_empty;
        }

        // === АВТОРИЗАЦИЯ ===
        function switchTab(tab) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
            if (tab === 'login') {
                document.querySelectorAll('.auth-tab')[0].classList.add('active');
                document.getElementById('loginForm').classList.add('active');
            } else {
                document.querySelectorAll('.auth-tab')[1].classList.add('active');
                document.getElementById('registerForm').classList.add('active');
            }
        }

        // === AUTH HANDLERS ===
        function setupAuthHandlers() {
            document.getElementById('loginForm').addEventListener('submit', handleLogin);
            document.getElementById('registerForm').addEventListener('submit', handleRegister);
        }

        async function handleLogin(e) {
            e.preventDefault();
            const msgEl = document.getElementById('login-message');
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            
            msgEl.style.color = '#6f9bd1';
            msgEl.innerText = 'Signing in...';
            
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: email,
                        password: password,
                        language: currentLang
                    })
                });
                
                const result = await res.json();
                console.log('Login response:', res.status, result);
                
                if (res.ok && result.token && result.user) {
                    const userData = {
                        id: result.user.id,
                        email: result.user.email,
                        username: result.user.username,
                        avatar_url: result.user.avatar_url || null,
                        token: result.token
                    };
                    localStorage.setItem('user', JSON.stringify(userData));
                    msgEl.style.color = '#2ecc71';
                    msgEl.innerText = '✓ Login successful!';
                    document.getElementById('login-email').value = '';
                    document.getElementById('login-password').value = '';
                    setTimeout(() => showForum(result.user), 500);
                } else {
                    msgEl.style.color = '#e74c3c';
                    msgEl.innerText = result.error || `Login failed (${res.status})`;
                    console.log('Login failed:', email, res.status);
                }
            } catch (err) {
                msgEl.style.color = '#e74c3c';
                msgEl.innerText = 'Network error: ' + err.message;
                console.error('Login error:', err);
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const msgEl = document.getElementById('reg-message');
            const username = document.getElementById('reg-username').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            
            msgEl.style.color = '#6f9bd1';
            msgEl.innerText = 'Creating account...';
            
            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: username,
                        email: email,
                        password: password,
                        language: currentLang
                    })
                });
                
                const result = await res.json();
                console.log('Register response:', res.status, result);
                
                if (res.ok || res.status === 201) {
                    msgEl.style.color = '#2ecc71';
                    msgEl.innerText = result.message || '✓ Account created! Check email to verify.';
                    document.getElementById('registerForm').reset();
                    setTimeout(() => switchTab('login'), 2000);
                } else if (res.status === 409) {
                    msgEl.style.color = '#e74c3c';
                    msgEl.innerText = 'Email or username already exists';
                } else {
                    msgEl.style.color = '#e74c3c';
                    msgEl.innerText = result.error || `Registration failed (${res.status})`;
                }
            } catch (err) {
                msgEl.style.color = '#e74c3c';
                msgEl.innerText = 'Network error: ' + err.message;
                console.error('Register error:', err);
            }
        }

        // === ОСНОВА ===
        function showForum(user) {
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('forum-content').classList.remove('hidden');
            document.getElementById('sidebar-username').innerText = user.username;
            loadTopics();
            checkNotifications(); 
        }

        function logout() { localStorage.removeItem('user'); location.reload(); }

        function formatContent(text) {
            if (!text) return '';
            return text.replace(/!\[(.*?)\]\((.*?)\)/g, '<img src="$2" alt="$1" class="topic-image">');
        }

        // === ТЕМЫ ===
        let currentCategory = 'all';
        let searchTimer = null;

        function filterCategory(category, element) {
            currentCategory = category;
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            if(element) element.classList.add('active');
            document.getElementById('forum-search').value = '';
            loadTopics(category);
        }

        document.getElementById('forum-search').addEventListener('input', (e) => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => { loadTopics(currentCategory, e.target.value); }, 500); 
        });

        async function loadTopics(category = 'all', search = '') {
            const container = document.getElementById('topics-container');
            const t = forumTranslations[currentLang];
            container.style.opacity = '0.5';
            
            try {
                let url = `/api/forum/topics?category=${category}`;
                if (search) url += `&search=${encodeURIComponent(search)}`;
                const res = await fetch(url);
                const topics = await res.json();

                container.style.opacity = '1';
                container.innerHTML = ''; 

                if (topics.length === 0) {
                    container.innerHTML = `<div style="text-align:center; padding:40px; color:#aaa;">No topics found</div>`;
                    return;
                }

                topics.forEach(topic => {
                    const date = new Date(topic.created_at).toLocaleDateString();
                    let icon = 'fa-comments';
                    let catName = t.cat_general || 'General';
                    
                    if(topic.category === 'engine') { icon = 'fa-cogs'; catName = t.cat_engine; }
                    else if(topic.category === 'chassis') { icon = 'fa-car-crash'; catName = t.cat_chassis; }
                    else if(topic.category === 'coding') { icon = 'fa-laptop-code'; catName = t.cat_coding; }

                    const html = `
                    <div class="topic-card" onclick="openTopic(${topic.id})">
                        <div class="topic-main">
                            <div class="topic-icon"><i class="fas ${icon}"></i></div>
                            <div class="topic-info">
                                <span style="font-size:10px; color:var(--accent-color); text-transform:uppercase;">${catName}</span>
                                <h3 style="margin-top:2px;">${topic.title}</h3>
                                <p>${formatContent(topic.content.substring(0, 80))}...</p>
                                <div style="font-size:11px; color:#555; margin-top:5px;">
                                    ${t.lbl_author}: <span style="color:white">${topic.username}</span> • ${date}
                                </div>
                            </div>
                        </div>
                        <div class="topic-stats"><div class="stat-mini"><span>${topic.reply_count || 0}</span><small>${t.lbl_replies}</small></div></div>
                    </div>`;
                    container.insertAdjacentHTML('beforeend', html);
                });
            } catch (err) { container.innerHTML = `<div style="text-align:center; color:#e74c3c;">Error loading topics</div>`; }
        }

        async function openTopic(id) {
            currentTopicId = id;
            document.querySelector('.forum-feed').classList.add('hidden');
            document.getElementById('single-topic-view').classList.remove('hidden');
            
            const container = document.getElementById('topic-detail-container');
            container.innerHTML = '<div class="skeleton" style="height:150px;"></div>';
            document.getElementById('replies-container').innerHTML = '';

            try {
                const user = JSON.parse(localStorage.getItem('user'));
                const userIdParam = user ? `&user_id=${user.id}` : '';
                const res = await fetch(`/api/forum/topic?id=${id}${userIdParam}`);
                const data = await res.json();
                
                const t = data.topic;
                const tr = forumTranslations[currentLang];
                const date = new Date(t.created_at).toLocaleDateString() + ' ' + new Date(t.created_at).toLocaleTimeString().slice(0,5);
                const currentUser = JSON.parse(localStorage.getItem('user'));
                
                let topicControls = '';
                if (currentUser && (parseInt(currentUser.id) === t.user_id || currentUser.role === 'admin')) {
                    topicControls = `<button class="control-btn delete" onclick="deleteTopic(${t.id})" title="${tr.btn_delete}"><i class="fas fa-trash"></i> ${tr.btn_delete}</button>`;
                }

                container.innerHTML = `
                    <div class="topic-header-card">
                        <div class="topic-meta-header">
                            <div class="topic-author-badge"><i class="fas fa-user"></i> ${t.username}</div>
                            <div style="display:flex; align-items:center;"><i class="fas fa-eye"></i> ${t.views} &nbsp;•&nbsp; ${date} ${topicControls}</div>
                        </div>
                        <h1 class="topic-full-title">${t.title}</h1>
                        <div class="topic-content-text">${formatContent(t.content)}</div>
                    </div>
                    <h3 style="margin-bottom:15px; color:#94a3b8; font-size:14px;">${tr.lbl_replies} (${data.posts.length})</h3>
                `;
                renderReplies(data.posts);
                window.scrollTo(0,0);
            } catch (e) { alert("Error: " + e.message); closeTopic(); }
        }

        function renderReplies(posts) {
            const container = document.getElementById('replies-container');
            const currentUser = JSON.parse(localStorage.getItem('user'));
            const tr = forumTranslations[currentLang];
            const canMark = document.querySelector('.topic-meta-header .delete'); 
            
            container.innerHTML = '';
            if (posts.length === 0) { container.innerHTML = `<div style="text-align:center; color:#555; padding:20px;">No replies yet</div>`; return; }

            posts.forEach(post => {
                const date = new Date(post.created_at).toLocaleDateString();
                const initial = post.username.charAt(0).toUpperCase();
                const solutionClass = post.is_solution ? 'solution' : '';
                const solutionBadge = post.is_solution ? `<span class="solution-badge"><i class="fas fa-check"></i> ${tr.lbl_solved}</span>` : '';

                let controls = '';
                if (currentUser && (parseInt(currentUser.id) === post.user_id || currentUser.role === 'admin')) {
                    controls += `<button class="control-btn delete" onclick="deletePost(${post.id}, this)"><i class="fas fa-trash"></i></button>`;
                }

                let solveBtn = '';
                if (canMark && !post.is_solution) {
                    solveBtn = `<button class="solve-btn" onclick="markSolution(${post.topic_id}, ${post.id}, this)" title="${tr.btn_solve}"><i class="fas fa-check"></i></button>`;
                }

                const html = `
                    <div class="reply-card ${solutionClass}">
                        <div class="reply-avatar">${initial}</div>
                        <div class="reply-body">
                            <div class="reply-header">
                                <div style="display:flex; align-items:center;"><span class="reply-username">${post.username}</span><span class="reply-date">${date}</span>${solutionBadge}</div>
                                <div style="display:flex; gap:10px; align-items:center;">${solveBtn}
                                    <button class="like-btn ${post.is_liked ? 'liked' : ''}" onclick="toggleLike(${post.id}, this)"><i class="${post.is_liked ? 'fas' : 'far'} fa-heart"></i> <span>${post.likes_count}</span></button>
                                    ${controls}
                                </div>
                            </div>
                            <div class="topic-content-text" style="font-size:14px;">${formatContent(post.content)}</div>
                        </div>
                    </div>`;
                container.insertAdjacentHTML('beforeend', html);
            });
        }

        function closeTopic() {
            currentTopicId = null;
            document.querySelector('.forum-feed').classList.remove('hidden');
            document.getElementById('single-topic-view').classList.add('hidden');
        }

        document.getElementById('replyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentTopicId) return;
            const input = document.getElementById('reply-input');
            const user = JSON.parse(localStorage.getItem('user'));
            const btn = e.target.querySelector('button[type="submit"]');
            const oldIcon = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

            try {
                const res = await fetch('/api/forum/topic', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ topic_id: currentTopicId, user_id: user.id, username: user.username, content: input.value })
                });
                if (res.ok) { input.value = ''; openTopic(currentTopicId); }
            } catch (err) { console.error(err); }
            btn.innerHTML = oldIcon;
        });

        const modal = document.getElementById('new-topic-modal');
        function openModal() { modal.classList.add('active'); }
        function closeModal() { modal.classList.remove('active'); }

        document.getElementById('createTopicForm').addEventListener('submit', async (e) => {
            e.preventDefault();

        // === ЗАГРУЗКА ФОТО ===
        function triggerUpload(inputId, btnElement) {
            currentTargetInputId = inputId;
            currentUploadBtn = btnElement;
            document.getElementById('global-file-input').click();
        }
        document.getElementById('global-file-input').addEventListener('change', async function(e) {
            if (this.files.length === 0) return;
            const targetInput = document.getElementById(currentTargetInputId);
            const originalIcon = currentUploadBtn.innerHTML;
            currentUploadBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            currentUploadBtn.disabled = true;
            const formData = new FormData();
            formData.append('file', this.files[0]);
            try {
                const res = await fetch('/api/upload', { method: 'POST', body: formData });
                const data = await res.json();
                if (res.ok) { targetInput.value += `\n![Image](${data.url})\n`; }
            } catch (err) { alert('Upload error'); }
            finally { currentUploadBtn.innerHTML = originalIcon; currentUploadBtn.disabled = false; targetInput.focus(); this.value = ''; }
        });

        // === ACTIONS ===
        async function deletePost(postId, element) {
            if(!confirm("Delete?")) return;
            const res = await fetch(`/api/forum/post?id=${postId}`, { method: 'DELETE' });
            if(res.ok) element.closest('.reply-card').remove();
        }
        async function deleteTopic(topicId) {
            if(!confirm("Delete topic?")) return;
            const res = await fetch(`/api/forum/topic?id=${topicId}`, { method: 'DELETE' });
            if(res.ok) { closeTopic(); loadTopics(); }
        }
        async function toggleLike(postId, btn) {
            const user = JSON.parse(localStorage.getItem('user'));
            const countSpan = btn.querySelector('span');
            let count = parseInt(countSpan.innerText);
            const isLiked = btn.classList.contains('liked');
            btn.classList.toggle('liked');
            btn.querySelector('i').className = isLiked ? 'far fa-heart' : 'fas fa-heart';
            countSpan.innerText = isLiked ? count - 1 : count + 1;
            await fetch('/api/forum/like', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({post_id: postId, user_id: user.id})});
        }
        async function markSolution(topicId, postId, btn) {
            const user = JSON.parse(localStorage.getItem('user'));
            if(!confirm("Mark as solution?")) return;
            const res = await fetch('/api/forum/solve', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({topic_id: topicId, post_id: postId, user_id: user.id})});
            if(res.ok) openTopic(topicId);
        }

        // === УВЕДОМЛЕНИЯ ===
        async function checkNotifications() {
            const user = JSON.parse(localStorage.getItem('user'));
            if(!user) return;
            const t = forumTranslations[currentLang];
            try {
                const res = await fetch(`/api/user/notifications?user_id=${user.id}`);
                const data = await res.json();
                const badge = document.getElementById('notif-badge');
                if (data.unread_count > 0) { badge.innerText = data.unread_count; badge.classList.remove('hidden'); } else { badge.classList.add('hidden'); }
                
                const list = document.getElementById('notif-list');
                if (data.notifications.length > 0) {
                    list.innerHTML = data.notifications.map(n => {
                        let icon = 'fa-bell', color = '#ccc', text = '';
                        if(n.type === 'reply') { icon = 'fa-reply'; color = '#3498db'; text = t.n_reply.replace('{user}', n.sender_name).replace('{topic}', n.topic_title); }
                        if(n.type === 'like') { icon = 'fa-heart'; color = '#e74c3c'; text = t.n_like.replace('{topic}', n.topic_title); }
                        if(n.type === 'solve') { icon = 'fa-check-circle'; color = '#2ecc71'; text = t.n_solve; }
                        return `<div class="notif-item ${n.is_read ? '' : 'unread'}" onclick="openTopic(${n.topic_id})"><div class="notif-icon" style="color:${color}"><i class="fas ${icon}"></i></div><div class="notif-content">${text}<div class="notif-time">${new Date(n.created_at).toLocaleTimeString()}</div></div></div>`;
                    }).join('');
                } else { list.innerHTML = `<div style="padding:20px; text-align:center; color:#777; font-size:13px;">${t.n_empty}</div>`; }
            } catch(e) {}
        }
        function toggleNotifications() {
            const d = document.getElementById('notif-dropdown');
            d.classList.toggle('hidden');
            if(!d.classList.contains('hidden')) markAllRead();
        }
        async function markAllRead() {
            const user = JSON.parse(localStorage.getItem('user'));
            document.getElementById('notif-badge').classList.add('hidden');
            await fetch('/api/user/notifications', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({user_id: user.id})});
        }
        setInterval(checkNotifications, 5000); // 5 сек для Live

        // === GOOGLE AUTH HANDLERS ===
        function handleGoogleSignIn() {
            if (typeof google === 'undefined') {
                alert('Google Sign-In is not available');
                return;
            }
            try {
                google.accounts.id.renderButton(
                    document.querySelector('[onclick="handleGoogleSignIn()"]'),
                    { theme: 'outline', size: 'large' }
                );
            } catch(e) {
                console.log('Google button render failed:', e);
            }
        }

        async function handleGoogleCallback(response) {
            const activeForm = document.querySelector('.auth-form.active');
            const msgEl = activeForm ? activeForm.querySelector('[id$="-message"]') : document.getElementById('login-message');
            
            if (msgEl) {
                msgEl.style.color = '#6f9bd1';
                msgEl.innerText = 'Signing in with Google...';
            }

            if (!response.credential) {
                if (msgEl) msgEl.innerText = 'No credential from Google';
                console.error('No credential from Google');
                return;
            }

            try {
                const res = await fetch('/api/auth/google-callback', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        credential: response.credential,
                        language: currentLang
                    })
                });

                const data = await res.json();
                console.log('Google callback response:', res.status, data);

                if (res.ok && data.token && data.user) {
                    const userData = {
                        id: data.user.id,
                        email: data.user.email,
                        username: data.user.username,
                        avatar_url: data.user.avatar_url || null,
                        token: data.token
                    };
                    localStorage.setItem('user', JSON.stringify(userData));
                    
                    if (msgEl) {
                        msgEl.style.color = '#2ecc71';
                        msgEl.innerText = '✓ Welcome!';
                    }
                    setTimeout(() => showForum(data.user), 500);
                } else {
                    if (msgEl) {
                        msgEl.style.color = '#e74c3c';
                        msgEl.innerText = data.error || `Google auth failed (${res.status})`;
                    }
                    console.log('Google auth failed:', res.status, data);
                }
            } catch (err) {
                if (msgEl) {
                    msgEl.style.color = '#e74c3c';
                    msgEl.innerText = 'Network error: ' + err.message;
                }
                console.error('Google callback error:', err);
            }
        }

        // === START ===
        window.onload = function() {
            // Check if user already logged in
            const userStr = localStorage.getItem('user');
            if (userStr) {
                try {
                    const user = JSON.parse(userStr);
                    showForum(user);
                    return;
                } catch(e) {
                    localStorage.removeItem('user');
                }
            }

            // Apply translations to auth screen
            applyTranslations();

            // Setup auth form handlers
            setupAuthHandlers();

            // Init Google Auth
            if (typeof google !== 'undefined') {
                google.accounts.id.initialize({
                    client_id: '855371837949-nsnfceo82efbfb5hmdks9ifrs0ra07vv.apps.googleusercontent.com',
                    callback: handleGoogleCallback
                });
            }
        };
    </script>
    <script src="./js/live.js"></script>
</body>
