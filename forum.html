<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMW Professional Community</title>
    
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/responsive.css" />
    <link rel="stylesheet" href="./css/forum.css" /> <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="shortcut icon" href="./assets/icons/ico.svg" type="image/x-icon">
    
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="bmw-pattern">

    <div id="webgl-container" style="position: fixed; top: 0; left: 0; z-index: -1; opacity: 0.5;"></div>

    <header>
      <div class="logo-container">
        <a class="main_logo_refr" href="index.html">
          <div class="logo">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
               <circle cx="50" cy="50" r="48" stroke="white" stroke-width="4" fill="black" />
               <path d="M 50,15 A 35,35 0 0,1 85,50 H 50 Z" fill="#1A6FB0" />
               <path d="M 50,50 H 85 A 35,35 0 0,1 50,85 Z" fill="white" />
               <path d="M 50,50 V 15 A 35,35 0 0,0 15,50 Z" fill="white" />
               <path d="M 50,50 H 15 A 35,35 0 0,0 50,85 Z" fill="#1A6FB0" />
            </svg>
          </div>
          <h1>BMW DTC Bot</h1>
        </a>
      </div>
      <div class="controls">
        <button id="language-toggle" class="btn">
            <i class="fas fa-globe"></i> <span>EN</span>
        </button>
        
        <button class="btn" onclick="toggleFavoritesModal()">
            <i class="fas fa-star"></i> <span data-i18n="savedBtn">Saved</span>
        </button>
        
        <button id="auth-btn" class="btn" onclick="toggleAuthModal()">
            <i class="fas fa-user"></i> <span>Login</span>
        </button>
      </div>
    </header>

    <main class="forum-container">
        <div class="forum-layout">
            
            <aside class="sidebar-card">
                <div id="user-mini-card" class="user-mini-profile" style="display:none;">
                    <div class="avatar-large" id="user-avatar-display">
                        <i class="fas fa-user"></i>
                    </div>
                    <h3 id="side-username" style="color:white; margin:10px 0;">User</h3>
                    <div class="user-stats-grid">
                        <div class="stat-box"><span class="stat-value">0</span><span class="stat-label">Posts</span></div>
                        <div class="stat-box"><span class="stat-value">0</span><span class="stat-label">Rep</span></div>
                    </div>
                </div>

                <nav class="nav-menu">
                    <div class="group-title">Main</div>
                    <a href="#" class="nav-item active" onclick="filterCat('all')"><i class="fas fa-stream"></i> All Topics</a>
                    <a href="#" class="nav-item" onclick="filterCat('news')"><i class="fas fa-bullhorn"></i> News</a>
                    <a href="#" class="nav-item" onclick="filterCat('general')"><i class="fas fa-comments"></i> General</a>
                    
                    <div class="group-title" style="margin-top:20px;">Technical</div>
                    <a href="#" class="nav-item" onclick="filterCat('engines')"><i class="fas fa-cogs"></i> Engines</a>
                    <a href="#" class="nav-item" onclick="filterCat('chassis')"><i class="fas fa-car-crash"></i> Chassis</a>
                    <a href="#" class="nav-item" onclick="filterCat('electronics')"><i class="fas fa-microchip"></i> Electronics</a>
                    <a href="#" class="nav-item" onclick="filterCat('coding')"><i class="fas fa-laptop-code"></i> Coding</a>
                </nav>
            </aside>

            <section class="forum-content">
                <div class="forum-header-actions">
                    <h1 class="page-title">Community Discussions</h1>
                    <button class="btn-create" onclick="openNewTopicModal()">
                        <i class="fas fa-plus"></i> <span>New Topic</span>
                    </button>
                </div>

                <div id="topics-container">
                    <div class="skeleton" style="height: 100px; margin-bottom: 15px;"></div>
                    <div class="skeleton" style="height: 100px; margin-bottom: 15px;"></div>
                </div>
            </section>
        </div>
    </main>

    <div id="new-topic-modal" class="modal-overlay hidden">
        <div class="modal-glass">
            <div class="modal-header">
                <h3>Create New Topic</h3>
                <button class="close-btn" onclick="closeNewTopicModal()"><i class="fas fa-times"></i></button>
            </div>
            <div style="display:flex; flex-direction:column; gap: 15px;">
                <select id="nt-category" class="form-input"></select>
                <input type="text" id="nt-title" class="form-input" placeholder="Topic Title">
                <textarea id="nt-content" class="form-input" rows="6" placeholder="Describe your issue..."></textarea>
                <button onclick="submitNewTopic()" class="btn-create btn-new-topic-submit" style="width:100%; justify-content:center;">Post Topic</button>
            </div>
        </div>
    </div>

    <div id="auth-modal" class="modal-overlay hidden">
        <div class="auth-glass-card">
            <button class="close-btn" style="position:absolute; top:15px; right:15px;" onclick="toggleAuthModal()"><i class="fas fa-times"></i></button>
            <h3 style="text-align:center; color:white; margin-bottom:20px;">Welcome Back</h3>
            
            <div id="g_id_onload" 
                 data-client_id="855371837949-nsnfceo82efbfb5hmdks9ifrs0ra07vv.apps.googleusercontent.com" 
                 data-callback="handleGoogleCredentialResponse"
                 data-auto_prompt="false">
            </div>
            <div class="g_id_signin" 
                 data-type="standard" 
                 data-size="large" 
                 data-theme="filled_blue" 
                 data-text="sign_in_with" 
                 data-shape="rectangular" 
                 data-logo_alignment="left">
            </div>
        </div>
    </div>

    <div id="favorites-modal" class="favorites-modal">
        <div class="favorites-content">
            <div class="favorites-header">
                <h3><i class="fas fa-star" style="color:#f1c40f"></i> Saved Codes</h3>
                <button class="close-button" onclick="toggleFavoritesModal()"><i class="fas fa-times"></i></button>
            </div>
            <div class="favorites-body" id="favorites-list"></div>
        </div>
    </div>

    <footer><p>BMW DTC Bot © 2026</p></footer>

    <script src="./js/script.js"></script> 
    <script src="./js/forum.js"></script> 
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</body>
</html>
