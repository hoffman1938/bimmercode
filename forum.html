<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMW Professional Community</title>
    
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/responsive.css" />
    <link rel="stylesheet" href="./css/forum.css" /> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="shortcut icon" href="./assets/icons/ico.svg" type="image/x-icon">
    
    <style>
        /* Auth Modal Styles */
        .auth-modal-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .auth-tabs {
            display: flex;
            gap: 10px;
            border-bottom: 2px solid rgba(255,255,255,0.1);
            margin-bottom: 20px;
        }

        .auth-tab {
            padding: 12px 20px;
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
        }

        .auth-tab:hover {
            color: #ccc;
        }

        .auth-tab.active {
            color: #0066b3;
            border-bottom-color: #0066b3;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .auth-form input {
            padding: 12px 15px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            color: white;
            font-size: 14px;
            transition: all 0.3s;
        }

        .auth-form input:focus {
            outline: none;
            background: rgba(255,255,255,0.1);
            border-color: #0066b3;
            box-shadow: 0 0 10px rgba(0,102,179,0.2);
        }

        .auth-form input::placeholder {
            color: #666;
        }

        .auth-form button {
            padding: 12px 20px;
            background: linear-gradient(135deg, #0066b3, #004a8a);
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .auth-form button:hover:not(:disabled) {
            background: linear-gradient(135deg, #0080d0, #0066b3);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,102,179,0.3);
        }

        .auth-form button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
        }

        .auth-divider {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 15px 0;
            color: #666;
            font-size: 12px;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.1);
        }

        .error-message {
            color: #e74c3c;
            font-size: 12px;
            padding: 10px;
            background: rgba(231,76,60,0.1);
            border-radius: 4px;
            margin-bottom: 10px;
            display: none;
        }

        .error-message.show {
            display: block;
        }
    </style>
</head>
<body class="bmw-pattern">

    <div id="webgl-container" style="position: fixed; top: 0; left: 0; z-index: -1; opacity: 0.5;"></div>

    <header>
      <div class="logo-container">
        <a class="main_logo_refr" href="index.html">
          <div class="logo">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
               <circle cx="50" cy="50" r="48" stroke="white" stroke-width="4" fill="black" />
               <path d="M 50,15 A 35,35 0 0,1 85,50 H 50 Z" fill="#1A6FB0" />
               <path d="M 50,50 H 85 A 35,35 0 0,1 50,85 Z" fill="white" />
               <path d="M 50,50 V 15 A 35,35 0 0,0 15,50 Z" fill="white" />
               <path d="M 50,50 H 15 A 35,35 0 0,0 50,85 Z" fill="#1A6FB0" />
            </svg>
          </div>
          <h1>BMW DTC Bot</h1>
        </a>
      </div>
      <div class="controls">
        <button id="language-toggle" class="btn">
            <i class="fas fa-globe"></i> <span>EN</span>
        </button>
        
        <button class="btn" onclick="toggleFavoritesModal()">
            <i class="fas fa-star"></i> <span data-i18n="savedBtn">Saved</span>
        </button>
        
        <button id="auth-btn" class="btn" onclick="toggleAuthModal()">
            <i class="fas fa-user"></i> <span>Login</span>
        </button>
      </div>
    </header>

    <main class="forum-container">
        <div class="forum-layout">
            
            <aside class="sidebar-card">
                <div id="user-mini-card" class="user-mini-profile" style="display:none;">
                    <div class="avatar-large" id="user-avatar-display">
                        <i class="fas fa-user"></i>
                    </div>
                    <h3 id="side-username" style="color:white; margin:10px 0;">User</h3>
                    <div class="user-stats-grid">
                        <div class="stat-box"><span class="stat-value">0</span><span class="stat-label">Posts</span></div>
                        <div class="stat-box"><span class="stat-value">0</span><span class="stat-label">Rep</span></div>
                    </div>
                </div>

                <nav class="nav-menu">
                    <div class="group-title">Main</div>
                    <a href="#" class="nav-item active" onclick="filterCat('all'); return false;"><i class="fas fa-stream"></i> All Topics</a>
                    <a href="#" class="nav-item" onclick="filterCat('news'); return false;"><i class="fas fa-bullhorn"></i> News</a>
                    <a href="#" class="nav-item" onclick="filterCat('general'); return false;"><i class="fas fa-comments"></i> General</a>
                    
                    <div class="group-title" style="margin-top:20px;">Technical</div>
                    <a href="#" class="nav-item" onclick="filterCat('engines'); return false;"><i class="fas fa-cogs"></i> Engines</a>
                    <a href="#" class="nav-item" onclick="filterCat('chassis'); return false;"><i class="fas fa-car-crash"></i> Chassis</a>
                    <a href="#" class="nav-item" onclick="filterCat('electronics'); return false;"><i class="fas fa-microchip"></i> Electronics</a>
                    <a href="#" class="nav-item" onclick="filterCat('coding'); return false;"><i class="fas fa-laptop-code"></i> Coding</a>
                </nav>
            </aside>

            <section class="forum-content">
                <div class="forum-header-actions">
                    <h1 class="page-title">Community Discussions</h1>
                    <button class="btn-create" onclick="openNewTopicModal()">
                        <i class="fas fa-plus"></i> <span>New Topic</span>
                    </button>
                </div>

                <div id="topics-container">
                    <div class="skeleton" style="height: 100px; margin-bottom: 15px;"></div>
                    <div class="skeleton" style="height: 100px; margin-bottom: 15px;"></div>
                </div>
            </section>
        </div>
    </main>

    <!-- NEW TOPIC MODAL -->
    <div id="new-topic-modal" class="modal-overlay hidden">
        <div class="modal-glass">
            <div class="modal-header">
                <h3>Create New Topic</h3>
                <button class="close-btn" onclick="closeNewTopicModal()"><i class="fas fa-times"></i></button>
            </div>
            <div style="display:flex; flex-direction:column; gap: 15px;">
                <select id="nt-category" class="form-input"></select>
                <input type="text" id="nt-title" class="form-input" placeholder="Topic Title">
                <textarea id="nt-content" class="form-input" rows="6" placeholder="Describe your issue..."></textarea>
                <button onclick="submitNewTopic()" class="btn-create btn-new-topic-submit" style="width:100%; justify-content:center;">Post Topic</button>
            </div>
        </div>
    </div>

    <!-- AUTH MODAL WITH TABS -->
    <div id="auth-modal" class="modal-overlay hidden">
        <div class="auth-glass-card">
            <button class="close-btn" style="position:absolute; top:15px; right:15px;" onclick="toggleAuthModal()"><i class="fas fa-times"></i></button>
            
            <div class="auth-modal-container">
                <h3 style="text-align:center; color:white; margin-bottom:10px;">Community Account</h3>
                
                <!-- TABS -->
                <div class="auth-tabs">
                    <button class="auth-tab active" id="auth-tab-login" onclick="showAuthTab('login')">
                        <i class="fas fa-sign-in-alt"></i> Sign In
                    </button>
                    <button class="auth-tab" id="auth-tab-register" onclick="showAuthTab('register')">
                        <i class="fas fa-user-plus"></i> Create Account
                    </button>
                </div>

                <!-- LOGIN FORM -->
                <form id="auth-login-form" class="auth-form" onsubmit="handleForumLogin(event)">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="auth-login-email" placeholder="your@email.com" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="auth-login-password" placeholder="••••••••" required>
                    </div>
                    <button type="submit" id="auth-login-btn" class="btn-submit">
                        <i class="fas fa-sign-in-alt"></i> Sign In
                    </button>
                </form>

                <!-- REGISTER FORM (HIDDEN) -->
                <form id="auth-register-form" class="auth-form" style="display:none;" onsubmit="handleForumRegister(event)">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="auth-register-email" placeholder="your@email.com" required>
                    </div>
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" id="auth-register-username" placeholder="username" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="auth-register-password" placeholder="••••••••" required>
                    </div>
                    <div class="form-group">
                        <label>Confirm Password</label>
                        <input type="password" id="auth-register-password2" placeholder="••••••••" required>
                    </div>
                    <button type="submit" id="auth-register-btn" class="btn-submit">
                        <i class="fas fa-user-plus"></i> Create Account
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- FAVORITES MODAL -->
    <div id="favorites-modal" class="favorites-modal">
        <div class="favorites-content">
            <div class="favorites-header">
                <h3><i class="fas fa-star" style="color:#f1c40f"></i> Saved Codes</h3>
                <button class="close-button" onclick="toggleFavoritesModal()"><i class="fas fa-times"></i></button>
            </div>
            <div class="favorites-body" id="favorites-list"></div>
        </div>
    </div>

    <footer><p>BMW DTC Bot © 2026</p></footer>

    <script src="./js/script.js"></script> 
    <script src="./js/auth-modal.js"></script>
    <script src="./js/forum.js"></script> 
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</body>
</html>
