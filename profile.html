<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - BMW Community</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/responsive.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        /* Специфичные стили для профиля */
        .profile-container { max-width: 800px; margin: 40px auto; padding: 20px; }
        .profile-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 30px; }
        .section-title { color: #fff; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; margin-bottom: 20px; margin-top: 30px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .avatar-preview { width: 100px; height: 100px; border-radius: 50%; background: #333; object-fit: cover; margin-bottom: 20px; border: 2px solid #0066b3; }
        .save-btn { width: auto; padding: 12px 30px; margin-top: 20px; }
    </style>
</head>
<body class="bmw-pattern">
    <header>
        <div class="logo-container">
            <a href="forum.html" class="btn"><i class="fas fa-arrow-left"></i> Back to Forum</a>
        </div>
        <div class="controls">
             <button id="logout-btn" class="btn" style="border-color: #e74c3c; color: #e74c3c;">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </header>

    <main class="profile-container">
        <div class="profile-card">
            <h1 style="margin-bottom: 5px;">Profile Settings</h1>
            <p style="color: #888; margin-bottom: 30px;">Manage your account and vehicle information</p>

            <div style="text-align: center;">
                <img src="" id="p-avatar" class="avatar-preview" onerror="this.src='./assets/icons/default-avatar.png'">
                <h2 id="p-username" style="color:white;">User</h2>
                <div class="info-badge severity-medium" id="p-role">User</div>
            </div>

            <form id="profile-form">
                <h3 class="section-title"><i class="fas fa-car"></i> Your BMW</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">Chassis Code</label>
                        <select id="p-chassis" class="form-input">
                            <option value="">Select Chassis</option>
                            <optgroup label="3 Series">
                                <option value="E36">E36</option><option value="E46">E46</option><option value="E90">E90</option><option value="F30">F30</option><option value="G20">G20</option>
                            </optgroup>
                            <optgroup label="5 Series">
                                <option value="E39">E39</option><option value="E60">E60</option><option value="F10">F10</option><option value="G30">G30</option>
                            </optgroup>
                            <optgroup label="X Series">
                                <option value="E53">E53 (X5)</option><option value="E70">E70 (X5)</option><option value="F15">F15 (X5)</option>
                            </optgroup>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Model Name</label>
                        <input type="text" id="p-model" class="form-input" placeholder="e.g. 325i, 530d, M3">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Engine Code</label>
                        <input type="text" id="p-engine" class="form-input" placeholder="e.g. N52, M54, B48">
                    </div>
                </div>

                <h3 class="section-title"><i class="fas fa-globe"></i> Preferences</h3>
                <div class="form-group">
                    <label class="form-label">Preferred Language</label>
                    <select id="p-lang" class="form-input">
                        <option value="en">English</option>
                        <option value="ru">Русский</option>
                        <option value="ka">ქართული</option>
                    </select>
                </div>
                
                <h3 class="section-title"><i class="fas fa-image"></i> Avatar</h3>
                <div class="form-group">
                    <label class="form-label">Avatar URL</label>
                    <input type="text" id="p-avatar-url" class="form-input" placeholder="https://...">
                </div>

                <button type="submit" class="form-submit save-btn">Save Changes</button>
            </form>
        </div>
    </main>

    <script src="./js/profile.js"></script>
</body>
</html>
