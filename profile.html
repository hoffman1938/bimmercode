<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Profile - BimmerCodes</title>
    <link rel="stylesheet" href="./css/style.css?v=2.92" />
    <link rel="stylesheet" href="./css/forum.css?v=2.92" />
    <link rel="stylesheet" href="./css/responsive.css?v=2.92" />
    <link rel="stylesheet"  />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body>
    <div id="webgl-container"></div>

    <header>
      <a href="/forum" class="logo-container">
        <div class="logo">
          <i class="fas fa-user-circle" style="color: #0066b3"></i>
        </div>
        <h1>User <span style="font-weight: 300">Profile</span></h1>
      </a>

      <div class="controls">
        <a
          href="/forum"
          class="btn"
          style="background: transparent; border: none"
        >
          <i class="fas fa-arrow-left"></i> Back to Forum
        </a>
      </div>
    </header>

    <main class="container">
      <!-- Profile Header -->
      <!-- Profile Header -->
      <div class="forum-panel profile-header-panel">
        <div class="profile-cover-bg">
            <!-- Optional: We could put a dynamic car image here later -->
        </div>

        <div class="profile-avatar-wrapper">
             <div class="profile-avatar-large" id="profile-avatar">
                <i class="fas fa-user"></i>
             </div>
        </div>
        
        <div style="text-align: center; padding: 0 20px;">
            <h2 id="profile-username" class="profile-username-main">Loading...</h2>
            
            <div id="profile-badges" style="margin-bottom: 20px; display: flex; justify-content: center; gap: 10px;"></div>
            
            <div id="profile-car" style="margin-bottom: 20px; display: inline-flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.3); padding: 8px 15px; border-radius: 50px; border: 1px solid var(--f-border);">
               <i class="fas fa-car" style="color: var(--bmw-sky)"></i> 
               <span style="color: white; font-weight: 500;">Unknown Model</span>
            </div>

            <div id="profile-bio" class="profile-bio-box">No bio available.</div>
            
            <!-- Edit Button (Hidden by default) -->
            <button id="btn-edit-profile" class="btn btn-edit-profile-action" style="display: none; margin-bottom: 20px;" onclick="openEditProfileModal()">
              <i class="fas fa-edit"></i> Edit Profile
            </button>
        </div>
      </div>

      <!-- Stats Grid -->
      <!-- Stats Grid -->
      <div class="profile-stats-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px;">
        <div class="stat-card-glass">
           <div class="stat-value-large" id="stat-reputation">0</div>
           <div class="stat-label">Reputation</div>
        </div>
        <div class="stat-card-glass">
           <div class="stat-value-large" id="stat-topics">0</div>
           <div class="stat-label">Topics Created</div>
        </div>
        <div class="stat-card-glass">
           <div class="stat-value-large" id="stat-joined">-</div>
           <div class="stat-label">Member Since</div>
        </div>
      </div>

      <!-- User's Topics -->
      <h3 style="margin-bottom: 20px; border-bottom: 1px solid var(--f-border); padding-bottom: 10px;">User Activity</h3>
      
      <div id="profile-topics-container">
        <!-- Topics will be loaded here -->
        <div class="skeleton-row"></div>
      </div>

    </main>

    <!-- Edit Profile Modal -->
    <div id="edit-profile-modal" class="auth-modal">
        <div class="auth-content">
            <button class="close-auth" onclick="closeEditProfileModal()">
                <i class="fas fa-times"></i>
            </button>
            <div style="text-align: center; margin-bottom: 25px;">
                <h2 style="color: white; margin: 0; font-size: 24px;">Edit Profile</h2>
                <p style="color: var(--text-muted); font-size: 13px; margin-top: 5px;">Update your public profile details</p>
            </div>
            <form id="edit-profile-form" onsubmit="handleProfileUpdate(event)">
                <div class="form-group">
                    <label>Bio</label>
                    <textarea id="edit-bio" class="auth-input" rows="3" placeholder="Tell us about yourself..."></textarea>
                </div>
                <div class="form-group">
                    <label>Car Model</label>
                    <input type="text" id="edit-car" class="auth-input" placeholder="e.g. BMW G20 330i">
                </div>
                <div class="form-group">
                    <label>Avatar</label>
                    <div class="avatar-upload-container">
                        <!-- Preview -->
                        <div class="avatar-preview-edit" id="avatar-preview-edit">
                            <i class="fas fa-user"></i>
                        </div>
                        
                        <!-- Buttons -->
                        <div class="avatar-actions">
                            <button type="button" class="btn-upload-avatar" onclick="triggerAvatarUpload()">
                                <i class="fas fa-upload"></i> Upload Image
                            </button>
                            <button type="button" class="btn-delete-avatar" onclick="deleteAvatar()" id="btn-delete-avatar" style="display: none;">
                                <i class="fas fa-trash"></i> Remove
                            </button>
                        </div>
                        
                        <!-- Hidden file input -->
                        <input type="file" id="avatar-file-input" accept="image/*" hidden onchange="handleAvatarUpload(event)">
                        
                        <!-- Hidden URL storage (kept for backward compatibility) -->
                        <input type="hidden" id="edit-avatar" value="">
                    </div>
                </div>
                <button type="submit" class="submit-btn">Save Changes</button>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <!-- Content injected by js/footer.js -->
    </footer>
    <script src="./js/footer.js"></script>

    <script src="./js/translations.js?v=2.91"></script>
    <script src="./js/script.js?v=2.91"></script>
    <script src="./js/forum.js?v=2.91"></script> <!-- Reusing for auth logic/utils -->
    <script src="./js/profile.js"></script>
    <script src="./js/live.js?v=2.91"></script>
  </body>
</html>
