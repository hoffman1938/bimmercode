<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Discussion — BimmerCodes Forum</title>
    <meta name="description" content="BMW enthusiast discussion on BimmerCodes forum." />
    <meta name="theme-color" content="#050507" />

    <link rel="stylesheet" href="./css/tokens.css?v=3.0" />
    <link rel="stylesheet" href="./css/forum.css?v=3.0" />
    <link rel="stylesheet" href="./css/notifications.css?v=3.0" />
    <link rel="shortcut icon" href="./assets/icons/ico.svg" type="image/x-icon" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>

    <!-- JSON-LD: topic-level schema — populated at runtime -->
    <script id="topic-jsonld" type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "DiscussionForumPosting",
      "name": "BimmerCodes Forum Topic",
      "url": "https://bimmercodes.net/topic"
    }
    </script>
  </head>
  <body class="forum-page">
    <div id="webgl-container" aria-hidden="true"></div>

    <header class="forum-header">
      <button class="btn btn-icon btn-ghost mobile-only" onclick="toggleMobileMenu()" aria-label="Toggle menu">
        <i class="fas fa-bars" aria-hidden="true"></i>
      </button>
      <a href="/forum" class="logo-container" aria-label="BimmerCodes Forum home">
        <div class="logo"><i class="fas fa-comments" aria-hidden="true"></i></div>
        <h1>BimmerCodes <span class="accent">Forum</span></h1>
      </a>
      <div class="controls">
        <a href="/forum" class="btn btn-ghost"><i class="fas fa-arrow-left"></i> <span data-i18n="backToTopics">Back</span></a>
        <button class="btn btn-ghost" id="forum-language-toggle" onclick="switchForumLanguage()" title="Language">
          <i class="fas fa-globe"></i> <span id="forum-lang-display">EN</span>
        </button>
        <a href="#" class="btn" id="auth-btn" onclick="toggleAuthModal(); return false;">
          <i class="fas fa-user"></i> <span data-i18n="loginBtn">Login</span>
        </a>
      </div>
    </header>

    <main class="forum-container">
      <div class="ad-slot ad-header" data-ad-slot="topic-top">Advertisement</div>

      <section class="topic-view">
        <div class="topic-content" id="topic-content">
          <!-- Skeleton while loading -->
          <div class="topic-header-card" id="topic-skeleton">
            <div class="skeleton skeleton-line long" style="height:26px; margin-bottom:12px;"></div>
            <div class="skeleton skeleton-line medium" style="height:14px;"></div>
          </div>
          <div class="skeleton-card" style="margin-top:16px;">
            <div class="skeleton circle" style="width:44px;height:44px;"></div>
            <div>
              <div class="skeleton skeleton-line long"></div>
              <div class="skeleton skeleton-line medium" style="margin-top:8px;"></div>
            </div>
          </div>
        </div>

        <aside class="sidebar" aria-label="Topic info">
          <div class="sidebar-card" id="topic-info-card" hidden>
            <h3 class="sidebar-title" data-i18n="topicInfo">Topic info</h3>
            <div id="topic-info-body"></div>
          </div>
          <div class="ad-slot ad-sidebar" data-ad-slot="topic-sidebar">Advertisement</div>
        </aside>
      </section>
    </main>

    <!-- AUTH MODAL (reused) -->
    <div id="auth-modal" class="modal" role="dialog" aria-modal="true">
      <div class="modal-card">
        <div class="modal-header">
          <h2 data-i18n="welcomeBack">Welcome back</h2>
          <button class="modal-close" onclick="toggleAuthModal()" aria-label="Close"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body">
          <form id="login-form" class="auth-form active">
            <div class="field">
              <label for="login-email" data-i18n="emailUsernameLabel">Email or username</label>
              <input type="text" id="login-email" required autocomplete="username" />
            </div>
            <div class="field">
              <label for="login-password" data-i18n="passwordLabel">Password</label>
              <input type="password" id="login-password" required autocomplete="current-password" />
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;" data-i18n="signInBtn">Sign In</button>
            <p id="login-msg" class="field-error" style="text-align:center;"></p>
          </form>
        </div>
      </div>
    </div>

    <!-- ============================= CODE DETAIL MODAL (shared) ============================= -->
    <div id="code-detail-modal" class="modal">
      <div class="modal-content" style="max-width: 680px; width: 92%;">
        <span class="close-btn" onclick="hideDetail && hideDetail()" aria-label="Close">&times;</span>
        <div id="code-detail" class="hidden"></div>
        <div id="parts-finder-container" class="hidden"></div>
      </div>
    </div>
    <div id="search-container" style="display:none;"></div>

    <footer><!-- injected by js/footer.js --></footer>

    <script src="./js/footer.js" defer></script>
    <script src="./js/translations.js?v=3.0" defer></script>
    <script src="./js/script.js?v=3.0" defer></script>
    <script src="./js/topic.js?v=3.0" defer></script>
    <script src="./js/live.js?v=3.0" defer></script>
  </body>
</html>
