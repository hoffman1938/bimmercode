<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topic View - BMW Community</title>
    
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="shortcut icon" href="./assets/icons/ico.svg" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        /* Стили специфичные для просмотра темы */
        :root {
            --f-bg: #0b0d11;
            --f-panel: #151922;
            --f-border: #2a2f3a;
            --f-accent: #0066b3;
            --f-text: #e0e0e0;
            --f-text-muted: #8b9bb4;
        }
        body { background-color: var(--f-bg); font-family: 'Inter', sans-serif; color: var(--f-text); }

        .layout-grid {
            max-width: 1200px;
            margin: 80px auto 40px;
            display: grid;
            grid-template-columns: 1fr 300px; /* Контент слева, инфо справа */
            gap: 25px;
            padding: 0 15px;
        }

        /* Post Card */
        .post-card {
            background: var(--f-panel);
            border: 1px solid var(--f-border);
            border-radius: 8px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        
        .post-header {
            padding: 15px 20px;
            background: rgba(255,255,255,0.02);
            border-bottom: 1px solid var(--f-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--f-text-muted);
        }

        .post-body {
            display: grid;
            grid-template-columns: 180px 1fr;
            min-height: 200px;
        }

        /* Author Side */
        .post-author {
            padding: 20px;
            background: rgba(0,0,0,0.2);
            border-right: 1px solid var(--f-border);
            text-align: center;
        }
        .author-avatar {
            width: 80px; height: 80px;
            border-radius: 50%;
            background: #333;
            margin: 0 auto 10px;
            object-fit: cover;
            border: 2px solid #333;
        }
        .author-name { font-weight: 700; color: white; margin-bottom: 5px; display: block; }
        .author-role { font-size: 11px; padding: 2px 8px; background: #222; border-radius: 4px; display: inline-block; }
        .author-stats { margin-top: 15px; font-size: 11px; text-align: left; color: #777; }
        .author-stats div { margin-bottom: 3px; }

        /* Content Side */
        .post-content { padding: 25px; line-height: 1.6; font-size: 15px; }
        .post-content img { max-width: 100%; border-radius: 4px; }
        .post-content pre { background: #000; padding: 10px; border-radius: 4px; overflow-x: auto; }

        /* Footer Actions */
        .post-footer {
            padding: 10px 20px;
            border-top: 1px solid var(--f-border);
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        .btn-action {
            background: none; border: 1px solid transparent;
            color: var(--f-text-muted); cursor: pointer;
            font-size: 12px; padding: 5px 10px; border-radius: 4px;
            transition: 0.2s; display: flex; align-items: center; gap: 5px;
        }
        .btn-action:hover { background: rgba(255,255,255,0.05); color: white; }
        .btn-action.like-btn:hover { color: #e74c3c; }
        .btn-action.like-btn.liked { color: #e74c3c; }

        /* Topic Title Header */
        .topic-header-block { margin-bottom: 20px; }
        .topic-h1 { font-size: 24px; font-weight: 700; color: white; margin: 0 0 10px 0; }
        .topic-tags { display: flex; gap: 10px; }
        .tag { padding: 4px 10px; background: rgba(0, 102, 179, 0.2); color: var(--f-accent); border-radius: 4px; font-size: 11px; text-transform: uppercase; font-weight: 600; }

        /* Reply Box */
        .reply-area { margin-top: 40px; }
        .reply-editor {
            width: 100%;
            background: var(--f-panel);
            border: 1px solid var(--f-border);
            border-radius: 8px;
            padding: 15px;
            color: white;
            font-family: inherit;
            resize: vertical;
            min-height: 150px;
        }
        .btn-submit {
            background: var(--f-accent); color: white; border: none;
            padding: 10px 25px; border-radius: 4px; font-weight: 600;
            cursor: pointer; margin-top: 10px; float: right;
        }
        .btn-submit:hover { background: #005699; }

        @media (max-width: 768px) {
            .layout-grid { grid-template-columns: 1fr; }
            .post-body { grid-template-columns: 1fr; } /* Аватар сверху */
            .post-author { border-right: none; border-bottom: 1px solid var(--f-border); display: flex; align-items: center; gap: 15px; padding: 10px; text-align: left; }
            .author-avatar { width: 40px; height: 40px; margin: 0; }
            .author-stats { display: none; }
        }
    </style>
</head>
<body>

    <header style="position:fixed; top:0; width:100%; z-index:1000; background: rgba(11, 13, 17, 0.95); border-bottom: 1px solid var(--f-border); backdrop-filter:blur(10px);">
        <div style="max-width:1200px; margin:0 auto; padding:0 15px; height:60px; display:flex; align-items:center; justify-content:space-between;">
            <a href="forum.html" style="display:flex; align-items:center; gap:10px; text-decoration:none; color:white;">
                <i class="fas fa-chevron-left"></i>
                <span style="font-weight:600;">Back to Forum</span>
            </a>
            <div id="auth-container"></div>
        </div>
    </header>

    <div class="layout-grid">
        
        <main>
            <div class="topic-header-block">
                <div class="topic-tags" id="topic-tags-placeholder">
                    </div>
                <h1 class="topic-h1" id="topic-title">Loading topic...</h1>
            </div>

            <div id="posts-container">
                <div style="padding: 50px; text-align: center; color: #666;">
                    <i class="fas fa-circle-notch fa-spin"></i> Loading posts...
                </div>
            </div>

            <div class="reply-area" id="reply-box">
                <h3 style="color:white; margin-bottom:15px;">Post a Reply</h3>
                <textarea class="reply-editor" id="reply-content" placeholder="Write your reply here... (Markdown supported)"></textarea>
                <button class="btn-submit" onclick="submitReply()">Post Reply</button>
            </div>
        </main>

        <aside>
            <div class="post-card" style="padding: 20px;">
                <h4 style="color:white; margin-top:0;">Topic Info</h4>
                <div style="font-size:13px; color:#888; display:flex; flex-direction:column; gap:10px;">
                    <div style="display:flex; justify-content:space-between;">
                        <span>Created:</span> <span id="info-date" style="color:white">-</span>
                    </div>
                    <div style="display:flex; justify-content:space-between;">
                        <span>Views:</span> <span id="info-views" style="color:white">-</span>
                    </div>
                    <div style="display:flex; justify-content:space-between;">
                        <span>Replies:</span> <span id="info-replies" style="color:white">-</span>
                    </div>
                </div>
                <hr style="border:0; border-top:1px solid var(--f-border); margin:15px 0;">
                <button class="btn-action" style="width:100%; justify-content:center; border:1px solid var(--f-border);" onclick="shareTopic()">
                    <i class="fas fa-share-alt"></i> Share Topic
                </button>
            </div>
        </aside>

    </div>

    <script src="./js/topic-view.js"></script>
</body>
</html>
